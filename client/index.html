<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>MediStock — Pharmacy Management</title>
    <meta name="description" content="Pharmacy billing & inventory management: FEFO billing, batch & expiry tracking, purchases, reports." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#00695c" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediStock" />
    <style>
      #app-splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #004d40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #app-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        margin: 20px auto 0;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #80cbc4;
        border-radius: 50%;
        animation: splashSpin 0.8s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div style="text-align: center;">
        <img src="/icon-192.png" alt="MediStock" width="88" height="88" style="border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); display: inline-block;" onerror="this.onerror=null;this.src='icon-192.png';" />
        <h1 style="color: #ffffff; margin: 16px 0 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">MediStock</h1>
        <p style="color: #80cbc4; margin: 4px 0 0 0; font-size: 13px; font-weight: 500; letter-spacing: 0.5px;">Pharmacy Management</p>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
